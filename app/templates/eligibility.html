<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eligibility Checker - Study Abroad Hub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>Study Abroad Hub</h1>
        <p>Check your eligibility for international study programs.</p>

        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('programs_page') }}">Explore Programs</a>
            <a href="{{ url_for('eligibility_page') }}">Eligibility Checker</a>
        </nav>
    </header>

    <div class="page-container">

        <h2>Check Your Eligibility</h2>

        <p>Select a program and enter your academic scores.</p>

        <form method="POST" class="search-form">

            <label for="program_id">Select Program:</label>

            <select name="program_id" id="program_id" required>

                <option value="">Choose a program</option>

                {% for program in programs %}

                    <option value="{{ program['program_id'] }}">
                        {{ program['program_name'] }} -
                        {{ program['university_name'] }}
                    </option>

                {% endfor %}

            </select>

            <label for="cgpa">Your CGPA (out of 10):</label>

            <input
                type="number"
                id="cgpa"
                name="cgpa"
                min="0"
                max="10"
                step="0.01"
                required
            >

            <label for="ielts">Your IELTS Score:</label>

            <input
                type="number"
                id="ielts"
                name="ielts"
                min="0"
                max="9"
                step="0.5"
                required
            >

            <button type="submit">Check Eligibility</button>

        </form>

    </div>

    <footer>
        <p>Study Abroad Hub | Student Decision Support System</p>
    </footer>

</body>
</html>
